name: Go

on: [push, pull_request]

jobs:

  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: casbin
        ports:
          - 3306:3306
      postgres:
        image: postgres:10.16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: casbin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Run Unit tests
        run: go test -v -covermode=atomic -coverprofile=./profile.cov ./...

      # The ASF only permits actions from the apache/, github/ and actions/
      # namespaces (plus an infra-managed allowlist), so the coverage upload
      # runs the goveralls CLI directly instead of a third-party action.
      - name: Send coverage to Coveralls
        continue-on-error: true
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go install github.com/mattn/goveralls@latest
          "$(go env GOPATH)/bin/goveralls" -coverprofile=./profile.cov -service=github