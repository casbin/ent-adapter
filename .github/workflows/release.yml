name: Release

# Releases are cut manually by pushing a git tag. There is no automated
# versioning: Apache releases must be approved by a vote before they are made.
#
#   v1.4.0-rc1  ->  GitHub *pre-release* only (the candidate put up for a vote)
#   v1.4.0      ->  GitHub release + published to the package registry
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'casbin/ent-adapter'
    runs-on: ubuntu-latest
    outputs:
      is-rc: ${{ steps.meta.outputs.is-rc }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # A "-rc<N>" suffix marks a candidate that goes up for an Apache vote.
          if [[ "$version" =~ -rc[0-9]+$ ]]; then
            is_rc=true
          else
            is_rc=false
          fi

          # The artifact is named after the release it is a candidate for, so
          # the tarball that gets voted on is byte-identical to the one released.
          base="${version%-rc*}"
          name="apache-casbin-ent-adapter-${base}-incubating-src"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "base=${base}"
            echo "is-rc=${is_rc}"
            echo "name=${name}"
          } >> "$GITHUB_OUTPUT"

      - name: Build source release tarball
        run: |
          set -euo pipefail
          name="${{ steps.meta.outputs.name }}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" HEAD
          sha512sum "${name}.tar.gz" > "${name}.tar.gz.sha512"
          tar -tzf "${name}.tar.gz" | head -n 20

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.is-rc }}
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.name }}.tar.gz
            ${{ steps.meta.outputs.name }}.tar.gz.sha512
          body: |
            ${{ steps.meta.outputs.is-rc == 'true'
              && format('Release candidate `{0}` for version {1}.', steps.meta.outputs.tag, steps.meta.outputs.base)
              || format('Apache Casbin ent-adapter {0} (incubating).', steps.meta.outputs.base) }}

            The official source artifact is `${{ steps.meta.outputs.name }}.tar.gz`
            (the "Source code" archives below are generated by GitHub and are not
            part of the release). Download it together with its `.sha512` and sign
            it locally before use.

  publish:
    # Only real releases go to the package registry; candidates never do.
    needs: [release]
    if: needs.release.outputs.is-rc == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Publish to the Go module proxy
        run: |
          set -euo pipefail
          module="github.com/casbin/ent-adapter"
          version="${GITHUB_REF_NAME}"

          # Go has no upload step: requesting the version from proxy.golang.org
          # makes the proxy fetch and cache it, which lists it on pkg.go.dev.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "https://proxy.golang.org/${module}/@v/${version}.info"; then
              echo "published ${module}@${version}"
              exit 0
            fi
            echo "proxy not ready yet (attempt ${attempt}), retrying..."
            sleep 30
          done

          echo "failed to publish ${module}@${version} to proxy.golang.org"
          exit 1
